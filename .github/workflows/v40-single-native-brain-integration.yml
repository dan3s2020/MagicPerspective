name: V40 original Brain mixed witnessed goals and human evidence
on:
  push:
    branches:
      - integration/V40-ORIGINAL-BRAIN-LEARNED-GOALS-REAL-QA-20261107
  workflow_dispatch:
jobs:
  v40-shared-brain-no-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax on original V34 and verbatim research modules
        run: |
          node --check v17/transcend/torus-aether/devour/brain.mjs
          node --check v17/transcend/torus-aether/worlds/observed-instruction-goals.mjs
          node --check v17/transcend/torus-aether/worlds/path-answer-writer.mjs
          node --check v17/research/text-hypermaze/real-squad-evidence-paths.mjs
          node --check v17/research/text-hypermaze/v40-original-brain-evidence.mjs
          node --check v17/tests/v40-single-original-brain-integration.test.mjs
          node --check v17/research/text-hypermaze/START_V40_REAL_HUMAN_QA.mjs
          node --check v17/research/text-hypermaze/v40-original-source-witness-memory.mjs
          node --check v17/transcend/torus-aether/devour/devour.mjs
          node --check v17/transcend/torus-aether/devour/worker.mjs
          node --check v17/transcend/torus-aether/ui/v40-live-human.js
      - name: One original brain checkpoint, witnessed intent, real QA preference and strict refusal
        run: node --test v17/tests/v40-single-original-brain-integration.test.mjs
      - name: Exact V32 compact source motif memory, verified replay, and saved original Brain manifest
        run: node --test v17/tests/v40-source-memory-shared-brain.test.mjs
      - name: Safety guards for serious real human original-Brain training
        run: node --test v17/tests/v40-real-training-checkpoint-guard.test.mjs
      - name: ACTUAL native V17/V34 worker, frozen V36 and V39 original Brain paths, old UI preserved
        run: node --test v17/tests/v40-native-live-qa-http.test.mjs
      - name: Original V34 integration core compatibility
        run: |
          node --test v17/tests/v34-incremental-observed-character-rules.test.mjs
          node --test v17/tests/v31-million-original-log-attraction.test.mjs
  v40-authentic-9000-human-qa:
    # Resource-intensive, run explicitly; previous push executions archived independently.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine SQuAD1.1 train+dev SHA checked, shared V34 Brain V36 and V39, 9000 train and 650 blind questions
        run: node --test v17/tests/v40-real-9000-qa-shared-brain.test.mjs
