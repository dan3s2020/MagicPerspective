name: V42 3-SAT clause-blind feedback hypermaze
on:
  push:
    branches:
      - experiment/V42-3SAT-REAL-HYPERMAZE-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-v42-feedback-3sat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V42 actual original shapeGraph with no preclassified satisfying exits
        run: node --test v17/tests/v42_3sat_feedback_maze.test.mjs
