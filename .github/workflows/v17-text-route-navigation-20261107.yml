name: V17 experimental text route / loop escape
on:
  push:
    branches:
      - experiment/V17-LEARNED-TEXT-ROUTE-ESCAPE-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source syntax and real V17 routing tests
        run: |
          node --check v17/transcend/torus-aether/text-route-navigation.mjs
          node --check v17/transcend/torus-aether/devour/brain.mjs
          node --check v17/transcend/torus-aether/ui/app.js
          node --test v17/tests/text-route-navigation.test.mjs
      - name: Existing V17 unchanged graph and checkpoint regression
        run: node --test v17/tests/torus-brain.test.mjs
