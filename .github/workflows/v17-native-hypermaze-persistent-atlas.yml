name: Native V17 full learned-world atlas — same Brain, exact graph and persistent failures
on:
  push:
    branches:
      - experiment/V17-PERSISTENT-HYPERMAZE-ATLAS-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-brain-and-permanent-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real original V17 Brain / discovered operators / atlas / HTTP / visualizer syntax
        run: |
          node --check v17/research/text-hypermaze/persistent-atlas.mjs
          node --check v17/research/text-hypermaze/goal-conditioned-native.mjs
          node --check v17/transcend/torus-aether/devour/worker.mjs
          node --check v17/transcend/torus-aether/devour/devour.mjs
          node --check v17/tests/native-hypermaze-persistent-atlas.test.mjs
          node --check v17/transcend/torus-aether/ui/native-hypermaze.js
      - name: Complete explored maze vs TRUNCATED frontier, all successes/failures/operators, exact UTF8 persistent restart
        run: node --test v17/tests/native-hypermaze-persistent-atlas.test.mjs
      - name: Original untouched 2D shape and original-world text transfer contract
        run: |
          node --test v17/tests/native-hypermaze-shape-parity.test.mjs
          node --test v17/tests/native-hypermaze-goal-text.test.mjs
          node --test v17/tests/native-hypermaze-compositional-heldout.test.mjs
      - name: Full previous 100+24 long text first-shape predictions must stay correct, not new byte model
        run: node --test v17/tests/native-hypermaze-long-multistep-heldout.test.mjs
      - name: Actual original V17 text worker with Unicode and direct API remains functional
        run: node --test v17/tests/native-hypermaze-original-worker-integration.test.mjs
      - name: Stopship still required: not proof of 100 percent long semantic first answers
        run: node --test v17/tests/hypermaze-stopship-release.test.mjs
  windows-original-launchers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Original PowerShell launchers unchanged and parsable
        shell: powershell
        run: |
          foreach($p in @("v17/START_V17.ps1","v17/START_MAGIC_REAL.ps1","v17/START_TINYSTORIES.ps1")){
            $tokens=$null;$errs=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errs)|Out-Null
            if($errs.Count){throw ($p+": "+($errs|Out-String))}
          }
