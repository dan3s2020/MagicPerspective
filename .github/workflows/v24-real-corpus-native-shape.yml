name: V24 real corpus native Discoverer integration
on:
  push:
    branches:
      - experiment/V24-REAL-CORPUS-NATIVE-SHAPE-20261107
  workflow_dispatch:
jobs:
  real-dataset-trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original V17/V22 immutable source and pre-action shape
        run: node --test v17/tests/v22-exact-original-discoverer.test.mjs
      - name: V23 text graph and noise regressions
        run: node --test v17/tests/v23-observed-relational-hypermaze.test.mjs v17/tests/v23-noisy-long-route.test.mjs v17/tests/v23-unknown-answer.test.mjs
      - name: Real corpus streaming, checkpoint, heldout, HTTP, UI
        run: node --test v17/tests/v24-real-native-training.test.mjs
      - name: Preserve legacy checkpoint bytes, reject corruption and restore segmented saves
        run: node --test v17/tests/v24-checkpoint-recovery.test.mjs
      - name: Actual 16D route provenance, restored legacy display and live navigation syntax
        run: node --test v17/tests/v24-hypergeometry-live.test.mjs
      - name: Produce actual Parquet dataset containing 85 Q/A pairs
        run: |
          python -m pip install pyarrow
          mkdir -p "$RUNNER_TEMP/v24-open-thoughts-parquet"
          python - <<'PY'
          import os
          import pyarrow as pa
          import pyarrow.parquet as pq
          out=os.path.join(os.environ["RUNNER_TEMP"],"v24-open-thoughts-parquet","sample.parquet")
          table=pa.table({
              "prompt":[f"parquet question {i}: what observed edge is next?" for i in range(85)],
              "answer":[f"parquet answer {i}: independently witnessed transformation" for i in range(85)]
          })
          pq.write_table(table,out,compression="NONE",row_group_size=19)
          print("Generated",out,len(table))
          nested_dir=os.path.join(os.environ["RUNNER_TEMP"],"v24-open-thoughts-conversations")
          os.makedirs(nested_dir,exist_ok=True)
          nested=pa.table({"conversations":[
              [{"from":"human","value":f"nested human question {i}: observe relations"},
               {"from":"gpt","value":f"nested gpt answer {i}: derived from experience"}]
              for i in range(85)]})
          pq.write_table(nested,os.path.join(nested_dir,"conversations.parquet"),
                         compression="NONE",row_group_size=17)
          print("Generated nested conversation fixture",len(nested))
          PY
      - name: Native V17 Parquet reader and exact V24 heldout split
        run: MP_V24_PARQUET_FIXTURE="$RUNNER_TEMP/v24-open-thoughts-parquet" MP_V24_PARQUET_CONVERSATION_FIXTURE="$RUNNER_TEMP/v24-open-thoughts-conversations" node --test v17/tests/v24-real-native-training.test.mjs
      - name: Node syntax validation
        run: |
          node --check v17/research/relational-hypermaze/real-corpus-core.mjs
          node --check v17/research/relational-hypermaze/real-data-source.mjs
          node --check v17/research/relational-hypermaze/real-trainer.mjs
      - name: Load stability beyond failing 15000-row checkpoint boundary
        run: node v17/research/relational-hypermaze/real-throughput-probe.mjs
      - name: "Actual Chromium browser - hypergraph, prediction history, real metrics and offline V17 UI"
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          node v17/tests/v24-browser-live-smoke.mjs

  windows-ps51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PowerShell 5.1 parse and exact launch script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content -LiteralPath 'v17/START_V24_REAL_TRAINING.ps1' -Raw
          [scriptblock]::Create($script) | Out-Null
          if ($script -match '[^\x00-\x7F]') { throw "Launcher must be ASCII-safe for Windows PowerShell 5.1" }
      - name: Real Windows Q/A training from source to live HTTP and persisted checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $txt = Join-Path $env:RUNNER_TEMP 'real qa corpus.txt'
          $lines = New-Object 'System.Collections.Generic.List[string]'
          for ($i=0; $i -lt 24; $i++) {
            $lines.Add("Q: What actual entity number $i is documented?")
            $lines.Add("A: The observed entity number $i is recorded in this world.")
          }
          [IO.File]::WriteAllLines($txt, $lines.ToArray(), [Text.Encoding]::UTF8)
          $launcher = (Resolve-Path 'v17/START_V24_REAL_TRAINING.ps1').Path
          $out = Join-Path $env:RUNNER_TEMP 'v24 checkpoint with spaces'
          $stdout = Join-Path $env:RUNNER_TEMP 'v24-output.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'v24-error.txt'
          $argsList = @('-NoProfile','-ExecutionPolicy','Bypass','-File',
            ('"' + $launcher + '"'),'-QaTxt',('"' + $txt + '"'),
            '-Out',('"' + $out + '"'),'-Port','18999',
            '-HeldOut','4','-SaveEvery','2','-OnlineEvery','1')
          $proc = Start-Process -FilePath 'powershell.exe' -ArgumentList $argsList -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $done = $false
            for ($j=0; $j -lt 100; $j++) {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18999/api/status' -TimeoutSec 2
                if ($status.mode -eq 'error') { throw "V24 backend error: $($status.error)" }
                if ($status.mode -eq 'finished') { $done = $true; break }
              } catch {
                if ($proc.HasExited) { throw "PowerShell V24 process exited early: $($proc.ExitCode)" }
              }
              Start-Sleep -Milliseconds 400
            }
            if (-not $done) { throw "Windows V24 trainer did not finish its real corpus" }
            if ($status.progress.cursor -ne 20 -or $status.progress.heldOut -ne 4) { throw "Wrong real split or cursor" }
            if ($status.atlas.stats.experienced -ne 20) { throw "Training observations missing" }
            $trace = Invoke-RestMethod -Uri 'http://127.0.0.1:18999/api/trace' -TimeoutSec 5
            if ($trace.row -lt 0) { throw "No real pre-action trace" }
            if (-not (Test-Path -LiteralPath (Join-Path $out 'atlas-v24.index.json'))) { throw "Checkpoint missing on Windows" }
            Write-Host "WINDOWS_V24_REAL_LIVE_PASS: $($status.progress.cursor) training / $($status.progress.heldOut) frozen heldout"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
          }
