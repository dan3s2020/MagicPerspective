name: V17 optional vectorized full-text learner — measured device updates and frozen holdouts
on:
  push:
    branches:
      - experiment/V17-CUDA-VECTORIZED-TEXT-THROUGHPUT-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-pytorch-fast-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PyTorch CPU reference only — hosted CI has no NVIDIA device
        run: python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Actual tensor model on selected PyTorch device, no label leakage or fabricated counts
        working-directory: v17/transcend/torus-aether/gpu
        run: python -m unittest -v test_fast_context_gpu.py
      - name: Original V17 GPU Python protocol syntax remains valid
        run: |
          python -m py_compile v17/transcend/torus-aether/gpu/fast_context_gpu.py
          python -m py_compile v17/transcend/torus-aether/gpu/worlds_gpu.py
      - name: Original text/maze cross-world V17 regression
        run: node --test v17/tests/torus-text-hyperpaths.test.mjs
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell existing scripts remain parseable
        shell: powershell
        run: |
          foreach ($path in @("v17/START_V17.ps1","v17/START_MAGIC_REAL.ps1","v17/INSTALL_FULL_AND_TRAIN.ps1")) {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell syntax: "+$path+" "+($errors | Out-String)) }
          }
