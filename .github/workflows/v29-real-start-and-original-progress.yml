name: V29 original training START truth and colored dataset progress
on:
  push:
    branches:
      - fix/V29-REAL-START-STATUS-DATASET-PROGRESS-20261107
  pull_request:
    branches:
      - fix/V28-V26-UI-REAL-V17-TRAINING-METRIC-PARITY-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and original KPI parity
        run: |
          node --check v17/apps/hypermaze-studio-v26/native-bridge.mjs
          node --check v17/apps/hypermaze-studio-v26/public/native-app.js
          node --test v17/apps/hypermaze-studio-v26/tests/native-bridge.test.mjs v17/apps/hypermaze-studio-v26/tests/native-v29-status.test.mjs
      - name: Execute actual original V17 worker against real repository text and check progress
        run: |
          node --test v17/apps/hypermaze-studio-v26/tests/native-real-runtime.test.mjs
      - name: Actual Chromium V26 UI, ORIGINAL native Q/A and real colored dataset bar
        run: |
          which google-chrome || which chromium
          node --test v17/apps/hypermaze-studio-v26/tests/native-browser.test.mjs
      - name: Archive actual screenshot from Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v29-real-V26-design-original-training
          path: v28-native-ui-real-chrome.png
          if-no-files-found: warn
          retention-days: 7

  windows-fail-closed-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse real V29 PowerShell source and refuse a stale occupied native port
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $pwd 'v17\START_V29_VERIFIED_REAL_CUDA.ps1'
          $tokens=$null;$syntaxErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$syntaxErrors) | Out-Null
          if($syntaxErrors.Count -gt 0) {throw ('PowerShell syntax invalid: '+($syntaxErrors | Out-String))}
          $listener=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Parse('127.0.0.1'),8908)
          $listener.Start()
          try {
            $output=(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Data $env:TEMP -OriginalOut $env:TEMP -NativePort 8908 -UIPort 8909 -Gpu off 2>&1 | Out-String)
            if($LASTEXITCODE -eq 0){throw 'V29 silently accepted occupied port'}
            if($output -notmatch 'PORT 8908 OCCUPIED') {throw ('Wrong error: '+$output)}
            Write-Host 'V29_WINDOWS_FAIL_CLOSED: original checkpoint unchanged; occupied native port prevented duplicate trainer'
          } finally {$listener.Stop()}
