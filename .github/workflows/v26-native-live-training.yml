name: V26 native fresh UI and live corpus training acceptance

on:
  push:
    branches:
      - experiment/V26-NEW-LIVE-TEXT-HYPERMAZE-TRAINING-20261107
  pull_request:
    branches:
      - experiment/V25-FROZEN-LONGTEXT-SHAPE-EVIDENCE-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax acceptance
        run: |
          node --version
          node --check v17/apps/hypermaze-studio-v26/engine.mjs
          node --check v17/apps/hypermaze-studio-v26/corpus.mjs
          node --check v17/apps/hypermaze-studio-v26/session.mjs
          node --check v17/apps/hypermaze-studio-v26/server.mjs
          node --check v17/apps/hypermaze-studio-v26/public/app.js
      - name: Original native frozen hypermaze and complete HTTP live UI acceptance
        run: |
          node --test v17/apps/hypermaze-studio-v26/tests/engine.test.mjs v17/apps/hypermaze-studio-v26/tests/session-server.test.mjs
      - name: Actual Chromium browser live canvas and controls acceptance
        run: |
          which google-chrome || which chromium
          node --test v17/apps/hypermaze-studio-v26/tests/browser-ui.test.mjs
      - name: Archive real browser UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-real-browser-ui
          path: v26-real-browser-ui.png
          if-no-files-found: warn
          retention-days: 7
