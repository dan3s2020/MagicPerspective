name: V17 CUDA zero-world transform regression (real GPU protocol)
on:
  push:
    branches:
      - fix/V17-GPU-AUTO-TRANSFORM-WORLDS-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-python-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install small reference backend (NumPy, not CUDA emulation)
        run: python -m pip install numpy
      - name: Actual V17 source syntax checks
        run: |
          python -m py_compile v17/transcend/torus-aether/gpu/worlds_gpu.py
          node --check v17/transcend/torus-aether/devour/brain.mjs
          node --check v17/tests/gpu-zero-auto-worlds-regression.test.mjs
      - name: Reproduce 0 auto-world setting against real Node-to-Python transform engine
        run: node --test v17/tests/gpu-zero-auto-worlds-regression.test.mjs
      - name: Retain original V17 native perspective GPU-protocol parity
        run: node --test v17/transcend/torus-aether/devour/perspective.gpu.test.mjs
  original-windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify both original PowerShell launchers without executing or modifying checkpoints
        shell: powershell
        run: |
          foreach ($path in @("v17/START_MAGIC_REAL.ps1","v17/START_V17.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell syntax: "+$path+" "+($errors | Out-String)) }
            Write-Host "WINDOWS_PS_OK $path"
          }
