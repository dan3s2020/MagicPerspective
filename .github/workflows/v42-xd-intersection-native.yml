name: V42 Native xD - Learned Transformations and Common Goal Intersection
on:
  push:
    branches:
      - research/V42-TORUS-LOOP-INTERSECTION-HYPOTHESES-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-xd-intersection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native shared Brain xD field and causal action intersection
        run: |
          node --check v17/tests/xd-intersection-constraints-hypotheses-20261107.test.mjs
          node --test v17/tests/xd-intersection-constraints-hypotheses-20261107.test.mjs
