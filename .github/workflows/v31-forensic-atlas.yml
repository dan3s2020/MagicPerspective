name: V31 Complete Retained Path Atlas — Original Native Brain
on:
  push:
    branches:
      - experiment/V31-CAUSAL-ATLAS-MISSING-PATH-AUDIT-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Strict source syntax
        run: |
          node --check v17/research/text-hypermaze/forensic-path-atlas.mjs
          node --check v17/research/text-hypermaze/cross-episode-native.mjs
          node --check v17/tests/v31-forensic-path-atlas.test.mjs
      - name: All retained pages, first wrong codepoints, missing bridges, same checkpoint, independently witnessed feedback
        run: node --test v17/tests/v31-forensic-path-atlas.test.mjs
      - name: Preserve exact original V17 maze 2D parity and cumulative V30 native Brain
        run: |
          node --test v17/tests/native-hypermaze-shape-parity.test.mjs
          node --test v17/tests/v30-cumulative-hypermaze.test.mjs
          node --test v17/tests/v30-cross-episode-transfer.test.mjs
  forensic-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Same original V17 native Brain on Windows
        shell: pwsh
        run: |
          node --test v17/tests/v31-forensic-path-atlas.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "V31 forensic atlas native Windows test failure" }
