name: V31 original Discoverer causal answer and measured learning curve
on:
  push:
    branches:
      - experiment/V31-CAUSAL-PATH-TO-ANSWER-LEARNING-CURVE-20261107
  workflow_dispatch:
jobs:
  causal-real-original-path:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check v17/transcend/torus-aether/worlds/path-answer-writer.mjs
          node --check v17/experiments/v31-causal-learning-curve.mjs
          node --check v17/transcend/torus-aether/worlds/learned-cognitive-map.mjs
          node --check v17/transcend/torus-aether/worlds/exercise.mjs
      - name: Measure exact first answers after 0 to 36 complete observed worlds (3 seeds), heldout & negative controls
        env:
          MP_V31_CURVE_JSON: v17/artifacts/v31-learning-curve.json
        run: node v17/experiments/v31-causal-learning-curve.mjs
      - name: Upload exact answer-attempt atlas (successes, failures and all wrong chars)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-causal-learning-curve-logs
          path: v17/artifacts/v31-learning-curve*
          if-no-files-found: warn
      - name: Native full-text 1800-token, provenance, search-bounds, and no-shortcut tests
        run: node --test v17/tests/v31-long-complete-text-path.test.mjs
      - name: Real V17 native worker, full-text path-to-answer, atlas evidence and no oracle leaks
        run: node --test v17/tests/v31-native-path-answer-http.test.mjs
      - name: Frozen long text with THREE original Shape hops and lost-edge recoverability
        run: node --test v17/tests/v31-three-hop-composition.test.mjs
      - name: Original V30, V22 and V19 regression tests remain intact
        run: |
          node --test v17/tests/v30-full-atlas-diagnostics.test.mjs v17/tests/v30-answer-forensics.test.mjs
          node --test v17/tests/v22-long-unseen-shape.test.mjs v17/tests/torus-cognitive-learned-map.test.mjs
  windows-v31-launcher-preflight:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PowerShell syntax and protect existing training checkpoints
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\v17\START_V31_REAL_TRAINING.ps1"),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          git switch -C "experiment/V31-CAUSAL-PATH-TO-ANSWER-LEARNING-CURVE-20261107"
          $data = Join-Path $env:RUNNER_TEMP "v31-preflight-only"
          $out = Join-Path $env:RUNNER_TEMP "v31-guarded-checkpoints"
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          # This file is a placeholder ONLY for preflight, no training.
          Set-Content -LiteralPath (Join-Path $data "preflight-placeholder.parquet") -Value "not-training-data" -Encoding Ascii
          & .\v17\START_V31_REAL_TRAINING.ps1 -Data $data -Out $out -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw "V31 PowerShell preflight failed" }
          $saves=Join-Path $out "brains"
          New-Item -ItemType Directory -Path $saves -Force | Out-Null
          $sentinel=Join-Path $saves "brain-0-stable+many.v8"
          Set-Content -LiteralPath $sentinel -Value "do-not-overwrite" -Encoding Ascii
          $blocked = $false
          try { & .\v17\START_V31_REAL_TRAINING.ps1 -Data $data -Out $out -ValidateOnly }
          catch { $blocked = $_.Exception.Message -match "Existing original checkpoint" }
          if (-not $blocked) { throw "Launcher failed to protect native checkpoint" }
          if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne "do-not-overwrite") { throw "Checkpoint modified" }
          Write-Host "V31 Windows PowerShell parser and safeguard PASS. CUDA and real data NOT executed in CI."
