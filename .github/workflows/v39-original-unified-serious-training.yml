name: V39 ONE original Brain serious training - real QAs, story bytes, maze, resumable checkpoint
on:
  push:
    branches:
      - experiment/V39-ORIGINAL-UNIFIED-SERIOUS-TRAIN-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-original-single-brain-windows-safety-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static parse and original native brain source integrity
        run: |
          node --check v17/research/v39/real-unified-trainer.mjs
          node --check v17/research/text-hypermaze/real-squad-evidence-paths.mjs
          node --check v17/tests/v39-original-unified-training-e2e.test.mjs
          node --check v17/transcend/torus-aether/devour/brain.mjs
          node --check v17/research/text-hypermaze/v34-live-research.mjs
      - name: Complete original native Brain actual QA plus unicode stories plus maze learning checkpoint, restart with zero duplicated input, SHA mismatch prevention, live UI
        run: node --test v17/tests/v39-original-unified-training-e2e.test.mjs
      - name: V34 original real HTTP single Brain xD and native Unicode motor regressions
        run: |
          node --test v17/tests/v34-native-real-live-http.test.mjs
          node --test v17/tests/v34-incremental-observed-character-rules.test.mjs
      - name: Original native multi-dimensional maze, text transformation and 2D worlds remain intact
        run: |
          node --test v17/tests/complete-xd-maze-atlas.test.mjs
          node --test v17/tests/text-hypermaze-coupled-axes.test.mjs
  official-external-human-answer-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official real SQuAD 1.1 LIVE download pinned SHA, original maze + human QA train/valid/test article split and V38 averaged shapeGraph native checkpoint proof
        run: node --test v17/tests/v38-real-averaged-evidence-validation.test.mjs
      - name: Full new V39 SERIOUS production-mode training over genuine 2400*2 human QA plus 650 independent DEV, resume and actual original Brain preserved
        run: node --test v17/tests/v39-official-full-serious-original-training.test.mjs
  windows-real-launcher-parsing:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell preflight validates V39 launcher without changing old V17/V34 scripts
        shell: powershell
        run: |
          foreach ($file in @("v17/START_V39_SERIOUS_TRAINING.ps1","v17/START_V34_VERIFIED.ps1","v17/START_V17.ps1")) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file).Path,[ref]$tokens,[ref]$issues) | Out-Null
            if ($issues.Count) { throw ($issues | Out-String) }
            Write-Host "POWERSHELL_SOURCE_VERIFIED $file"
          }
          if ((Get-Content "v17/START_V39_SERIOUS_TRAINING.ps1" -Raw) -notmatch "Get-FileHash") { throw "Official SQuAD SHA verification missing" }
          if ((Get-Content "v17/START_V39_SERIOUS_TRAINING.ps1" -Raw) -notmatch "OriginalBrain") { throw "Old original trained Brain requirement missing" }
          if ((Get-Content "v17/START_V39_SERIOUS_TRAINING.ps1" -Raw) -match "Remove-Item") { throw "Destructive cleanup is forbidden in launcher" }
          Write-Host "V39_WINDOWS_REAL_LAUNCHER_PRESERVES_OLD_CHECKPOINTS_AND_OLD_UI"

  windows-launcher-actual-serious-training:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create original real V17 Brain.v8 and UTF-8 corpus fixture in exclusive folder
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "v39-real-original"
          node v17/tests/v39-windows-ps-real-launcher-fixture.mjs $root
          if ($LASTEXITCODE -ne 0) { throw "Cannot create original native brain" }
      - name: Run FULL original serious PowerShell launcher on actual Windows using official SQuAD, native trained Brain and Unicode story input
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "v39-real-original"
          $sourceBrain = Join-Path $root "original-brain.v8"
          $dataDir = Join-Path $root "official-real-squad"
          $runDir = Join-Path $root "new-v39-run"
          $storyPath = Join-Path $root "TinyStories-train.txt"
          $before = (Get-FileHash -LiteralPath $sourceBrain -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "v17/START_V39_SERIOUS_TRAINING.ps1" -OriginalBrain $sourceBrain -Data $dataDir -Out $runDir -TinyStories $storyPath -Port 8978 -TrainSamples 80 -CalibrationSamples 40 -DevSamples 40 -Epochs 1 -CheckpointEvery 20 -SnapshotEvery 20 -BurnIn 20 -StoryLimit 5 -StoryEvery 4 -Download -ExitWhenFinished
          if ($LASTEXITCODE -ne 0) { throw "REAL user V39 PowerShell launcher failed" }
          $after = (Get-FileHash -LiteralPath $sourceBrain -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "ORIGINAL BRAIN CHECKPOINT WAS MODIFIED" }
          $resultPath = Join-Path $runDir "v39-result.json"
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw "User PowerShell launcher produced NO final verified training result"
          }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.restoreVerified -or
              $result.realTraining -ne 80 -or $result.storyCount -ne 5 -or
              $result.externalDev.n -ne 40 -or
              -not $result.internalCalibration.policySelectedBeforeDev) {
            throw "Original native Windows runner progress/checkpoint/DEV mismatch"
          }
          Write-Host "V39_REAL_WINDOWS_POWERSHELL_TRAINING_PASSED" ($result | ConvertTo-Json -Compress)
