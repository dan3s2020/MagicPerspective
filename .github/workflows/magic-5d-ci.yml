name: MagicPerspective 5D isolated verification
on:
  push:
    branches:
      - feature/MAGICPERSPECTIVE-5D-SPACETIME-MULTISCALE-20261105
  pull_request:
    branches:
      - main
jobs:
  pure-spacetime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real-data 5D camera and multiscale topology tests
        run: |
          node --check experiments/portal-universal-20261103/web/spacetime-core.mjs
          node --check experiments/portal-universal-20261103/web/spacetime.js
          node --test experiments/portal-universal-20261103/tests/spacetime.test.mjs
      - name: Run read-only SQLite temporal data tests (no CUDA requirement)
        run: |
          python -m py_compile experiments/portal-universal-20261103/server.py experiments/portal-universal-20261103/spacetime_api.py
          python -m unittest discover -s experiments/portal-universal-20261103/tests -p test_spacetime.py -v
