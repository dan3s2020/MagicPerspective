name: Original V42 Brain learns V5 discovery primitives in real SHA256 worlds
on:
  push:
    branches:
      - experiment/SHA256-V5-META-DISCOVERY-NATIVE-20261120
    paths:
      - research/sha256-labyrinth-20261119/native_v5_sha_discovery_transfer.mjs
      - .github/workflows/sha256-original-v5-discovery-transfer.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sha256-original-v5-discovery-transfer
  cancel-in-progress: true
jobs:
  native-meta-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source check and preserve original Brain
        run: |
          test -f v17/transcend/torus-aether/devour/brain.mjs
          test -f v17/transcend/torus-aether/worlds/exercise.mjs
          node --check research/sha256-labyrinth-20261119/native_v5_sha_discovery_transfer.mjs
      - name: Run V42 original Brain vs uniform, shuffled credit, and self-map heuristic
        env:
          SHA_DISCOVERY_TRAIN: '80'
          SHA_DISCOVERY_TEST: '25'
          SHA_DISCOVERY_MAX_STEPS: '160'
        run: node --max-old-space-size=4096 research/sha256-labyrinth-20261119/native_v5_sha_discovery_transfer.mjs
      - name: Save raw held-out worlds and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-v42-sha256-v5-discovery-transfer
          path: research/sha256-labyrinth-20261119/native_v5_sha_discovery_results.json
          if-no-files-found: warn
