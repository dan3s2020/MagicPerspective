name: V30 original native Brain cross-world hypermaze and atlas
on:
  push:
    branches:
      - experiment/V30-CROSS-EPISODE-TRANSFER-NATIVE-BRAIN-20261107
  workflow_dispatch:
jobs:
  native-original-shape-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing original V17 native shapeGraph parity
        run: node --test v17/tests/native-hypermaze-shape-parity.test.mjs
      - name: V30 independent cross-world paths, denials and native Brain save/load
        run: node --test v17/tests/v30-cross-episode-transfer.test.mjs
      - name: Complete per-world known graph and missing corridors, frozen atlas and original Brain save-load
        run: node --test v17/tests/v30-world-atlas.test.mjs
      - name: Real native world-event JSONL, full global atlas, original Brain HTTP and missing-path provenance
        run: node --test v17/tests/v30-native-atlas-http.test.mjs
      - name: Real V17 native text contrast operators, corpus memory, eviction truth and merge with world atlas
        run: node --test v17/tests/v30-native-corpus-atlas.test.mjs
      - name: Actual Chrome display of world atlas and missing paths
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          node v17/tests/v30-native-atlas-browser.test.mjs
      - name: Real segmented text contrast transfer through native original shape, positive and falsifying physical worlds
        run: node --test v17/tests/v30-segmented-native-corpus-transfer.test.mjs

  windows-native-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse actual Windows PowerShell 5.1 launcher
        shell: powershell
        run: |
          $code = Get-Content -LiteralPath 'v17/START_V30_NATIVE_ATLAS.ps1' -Raw
          [scriptblock]::Create($code) | Out-Null
          if ($code -match '[^\x00-\x7F]') { throw 'Launcher must be ASCII compatible' }
      - name: Produce witnessed source worlds and trained original V17 Brain
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'original brain test with spaces'
          node v17/tests/v30-windows-fixture.mjs $folder
      - name: Start real atlas via PowerShell and validate original checkpoint protection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'original brain test with spaces'
          $brain = Join-Path $folder 'trained original V17.v8'
          $events = Join-Path $folder 'world witnesses with spaces.jsonl'
          $out = Join-Path $folder 'new isolated atlas with spaces'
          $launcher = (Resolve-Path 'v17/START_V30_NATIVE_ATLAS.ps1').Path
          $hashBefore = (Get-FileHash -LiteralPath $brain -Algorithm SHA256).Hash
          $stdout = Join-Path $env:RUNNER_TEMP 'v30-powershell-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'v30-powershell-err.txt'
          $arguments = @('-NoProfile','-ExecutionPolicy','Bypass','-File',('"' + $launcher + '"'),'-OriginalBrain',('"' + $brain + '"'),'-Events',('"' + $events + '"'),'-Out',('"' + $out + '"'),'-Port','18901','-MaxStates','64','-MaxDepth','6','-SaveEvery','2')
          $proc = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ok = $false
            for ($i=0; $i -lt 120; $i++) {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18901/api/status' -TimeoutSec 2
                if ($status.mode -eq 'error') { throw "Backend error $($status.error)" }
                if ($status.mode -eq 'finished') { $ok = $true; break }
              } catch {
                if ($proc.HasExited) { throw "Launcher exited early with $($proc.ExitCode)" }
              }
              Start-Sleep -Milliseconds 400
            }
            if (-not $ok) { throw 'Native V30 world-event training did not finish' }
            if ($status.training.witnessedTransformations -ne 4) { throw 'Wrong witnessed observations' }
            if ($status.training.transferableRules -ne 2) { throw 'Crossworld transfer rules missing' }
            if ($status.atlas.sourceWorlds -ne 4) { throw 'Source worlds missing' }
            $payload = @{ episodeId='windows-new-world';startText='Ava has 17 marbles.';goal=@{numericEquals=21} } | ConvertTo-Json -Depth 5
            $plan = Invoke-RestMethod -Uri 'http://127.0.0.1:18901/api/plan' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 20
            if (-not $plan.found -or $plan.predicted -ne 'Ava has 21 marbles.') { throw "Frozen V17 prediction failed: $($plan.reason)" }
            $graph = Invoke-RestMethod -Uri 'http://127.0.0.1:18901/api/global-topology' -TimeoutSec 20
            if ($graph.totalNodes -lt 8 -or $graph.totalEdges -lt 5) { throw 'Empty global graph' }
            if (-not (Test-Path -LiteralPath (Join-Path $out 'original-brain-v30.v8'))) { throw 'Isolated V30 checkpoint missing' }
            $hashAfter = (Get-FileHash -LiteralPath $brain -Algorithm SHA256).Hash
            if ($hashBefore -ne $hashAfter) { throw 'Original V17 Brain checkpoint modified' }
            Write-Host "V30_REAL_WINDOWS_POWERSHELL_ATLAS_PASS: worlds=$($status.atlas.sourceWorlds) witnesses=$($status.training.witnessedTransformations) predicted=$($plan.predicted)"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
          }

  actual-openthoughts-parquet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet fixture generator only in CI
        run: python -m pip install --disable-pip-version-check pyarrow==22.0.0
      - name: Generate genuine ZSTD nested human/gpt Parquet
        run: python v17/tests/v30-parquet-fixture.py "$RUNNER_TEMP/v30-real-nested-parquet"
      - name: Real original V17 brain reads nested ZSTD Parquet, trains text and restarts without heldout leakage
        env:
          V30_TEST_PARQUET: /tmp/v30-real-nested-parquet
        run: |
          mkdir -p "$V30_TEST_PARQUET"
          python v17/tests/v30-parquet-fixture.py "$V30_TEST_PARQUET"
          node --test v17/tests/v30-real-parquet-resume.test.mjs
