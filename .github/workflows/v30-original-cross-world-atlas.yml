name: V30 original native Brain cross-world hypermaze and atlas
on:
  push:
    branches:
      - experiment/V30-CROSS-EPISODE-TRANSFER-NATIVE-BRAIN-20261107
  workflow_dispatch:
jobs:
  native-original-shape-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing original V17 native shapeGraph parity
        run: node --test v17/tests/native-hypermaze-shape-parity.test.mjs
      - name: V30 independent cross-world paths, denials and native Brain save/load
        run: node --test v17/tests/v30-cross-episode-transfer.test.mjs
      - name: Complete per-world known graph and missing corridors, frozen atlas and original Brain save-load
        run: node --test v17/tests/v30-world-atlas.test.mjs
      - name: Real native world-event JSONL, full global atlas, original Brain HTTP and missing-path provenance
        run: node --test v17/tests/v30-native-atlas-http.test.mjs
      - name: Real V17 native text contrast operators, corpus memory, eviction truth and merge with world atlas
        run: node --test v17/tests/v30-native-corpus-atlas.test.mjs
      - name: Actual Chrome display of world atlas and missing paths
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          node v17/tests/v30-native-atlas-browser.test.mjs
      - name: Real segmented text contrast transfer through native original shape, positive and falsifying physical worlds
        run: node --test v17/tests/v30-segmented-native-corpus-transfer.test.mjs
