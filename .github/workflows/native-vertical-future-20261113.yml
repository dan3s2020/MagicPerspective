name: Native organism vertical atmospheric future forecast
on:
  push:
    paths:
      - 'experiments/atmospheric-native-20261113/native-vertical-future.mjs'
      - '.github/workflows/native-vertical-future-20261113.yml'
  workflow_dispatch:
jobs:
  actual-multilayer-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone exactly pinned original V42 Brain
        run: |
          git clone --depth 1 --branch perf/V42-FAST-EXACT-CPU-RESUME-V41FAST-20261107 https://github.com/dan3s2020/MagicPerspective.git /tmp/original-v42
          test "$(git -C /tmp/original-v42 rev-parse HEAD)" = "ac205b5bc561274b957584a7dee058a1110ab6f8"
      - name: Check native experiment syntax
        run: node --check experiments/atmospheric-native-20261113/native-vertical-future.mjs
      - name: Live 3D historical atmosphere and predict blind future in original Brain
        env:
          V42_ORIGINAL_TEST_ROOT: /tmp/original-v42
          ATMOS_RUN_TAG: layered-2025
        run: node --max-old-space-size=6000 experiments/atmospheric-native-20261113/native-vertical-future.mjs
      - name: Upload exact raw outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-brain-real-three-layer-future
          path: experiments/atmospheric-native-20261113/results/native-vertical-future-layered-2025.json
          if-no-files-found: warn
