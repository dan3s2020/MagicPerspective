name: V17 native hyperpath regression gate (BLOCKED until complete)
on:
  push:
    branches:
      - experiment/V17-CAUSAL-HYPERPATH-NATIVE-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-v17-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native original implementation and UI parse
        run: |
          node --check v17/transcend/torus-aether/devour/brain.mjs
          node --check v17/transcend/torus-aether/devour/worker.mjs
          node --check v17/transcend/torus-aether/devour/devour.mjs
          node --check v17/transcend/torus-aether/worlds/observed-transformations.mjs
          node --check v17/transcend/torus-aether/worlds/constructed-paths.mjs
          node --check v17/transcend/torus-aether/worlds/shared-transformation-core.mjs
          node --input-type=module --check < v17/transcend/torus-aether/ui/app.js
      - name: Original Brain shared action core native tests
        run: node --test v17/tests/shared-world-core-v17.test.mjs
      - name: Live unchanged real native HTTP/UI integrations
        run: |
          node --test v17/tests/shared-world-core-http.test.mjs
          node --test v17/tests/real-corpus-live-progress.test.mjs
          node --test v17/tests/torus-unified-http.test.mjs
          node --test v17/tests/torus-live-observability.test.mjs
      - name: Existing local-axis and mathematical world causal regression tests
        run: |
          node --test v17/tests/local-axis-transport-shapes.test.mjs
          node --test v17/tests/coupled-symbolic-local-axes.test.mjs
          node --test v17/tests/xd-2048-states-local-language.test.mjs
      - name: Real TextCard prediction integrity (not substitute for goal-path learning)
        run: |
          python -m pip install numpy
          python v17/tests/actual-textcard-prediction-sampling.py
  windows-entrypoint-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse exact Windows native V17 scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("v17/START_V17.ps1", "v17/START_NATIVE_V17_TRAINING_LIVE.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file PowerShell parse failed: $($errors | Out-String)" }
          }
