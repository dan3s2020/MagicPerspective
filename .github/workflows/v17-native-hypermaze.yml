name: V17 native 38D text maze acceptance
on:
  push:
    branches:
      - experiment/V17-NATIVE-HYPERDIMENSIONAL-TEXT-NAVIGATOR-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check native 38D planner and acceptance tests
        run: |
          node --check v17/transcend/torus-aether/worlds/hyperdimensional-text-maze.mjs
          node --check v17/tests/hyperdimensional-text-maze-native.test.mjs
      - name: Validate actual native text state graph and 38D path inference
        run: node --test v17/tests/hyperdimensional-text-maze-native.test.mjs
      - name: Retain previous text path and graph acceptance tests
        run: |
          node --test v17/tests/torus-text-hyperpaths.test.mjs
          node --test v17/tests/constructed-paths-v17.test.mjs
  windows-native-routes:
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native 38D text route on Windows Node without a server mock
        shell: pwsh
        run: |
          node --test v17/tests/hyperdimensional-text-maze-native.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native 38D route tests failed" }
