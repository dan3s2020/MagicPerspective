name: SHA256 native Brain source contract (bounded)
on:
  push:
    branches:
      - experiment/SHA256-NATIVE-BRAIN-BLIND-WORLD-20261120
    paths:
      - .github/workflows/sha256-native-context-diagnostic.yml
      - research/sha256-labyrinth-20261119/native_sha256_context_diagnostic.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-sha256-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check research/sha256-labyrinth-20261119/native_sha256_context_diagnostic.mjs
          test -f v17/transcend/torus-aether/devour/brain.mjs
          echo "Capped context: 4...8 only; high-cost contexts cancelled for safety"
