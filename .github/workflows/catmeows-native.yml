name: CatMeows original Brain acoustic global-shape test
on:
  push:
    branches: [experiment/CATMEOWS-NATIVE-BRAIN-20261115]
    paths:
      - 'research/catmeows_native/**'
      - 'v17/transcend/torus-aether/align.mjs'
      - '.github/workflows/catmeows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-acoustic-shapes:
    strategy:
      fail-fast: false
      matrix:
        bin: [0, 2, 6]
    name: summary-and-contour-bin-${{matrix.bin}}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Download original CatMeows and derive real label-blind acoustic frames
        run: python research/catmeows_native/prepare.py
      - name: Test four acoustic-shape representations with owner heldout and permutation controls
        env:
          CATMEOWS_FULL: '1'
          CATMEOWS_TOKEN_MODE: high
          CATMEOWS_SAMPLING: undersample
          CATMEOWS_VARIANTS: audio_global,audio_shape,audio_contextual,audio_duration
          BRAIVOUR_AUDIO_FORM_BIN: ${{matrix.bin}}
        run: node --max-old-space-size=6000 research/catmeows_native/run.mjs
      - name: Upload all raw grouped predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-summary-bin-${{matrix.bin}}-genuine-results
          path: |
            runtime/catmeows/results-*.json
            runtime/catmeows/heldout_predictions-*.jsonl
          if-no-files-found: warn
