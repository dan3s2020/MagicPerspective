name: CatMeows original native organism multi-perspective acoustic experience
on:
  push:
    branches: [experiment/CATMEOWS-NATIVE-BRAIN-20261115]
    paths:
      - 'research/catmeows_native/**'
      - 'v17/transcend/torus-aether/align.mjs'
      - '.github/workflows/catmeows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-perspectives:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 3, 9]
    name: native-acoustic-views-${{matrix.n}}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Verify official 440 CatMeows WAV and construct unlabeled audio
        run: python research/catmeows_native/prepare.py
      - name: Test original organism across rotated sensory perspectives without owner/cat overlap
        env:
          CATMEOWS_FULL: '1'
          CATMEOWS_TOKEN_MODE: high
          CATMEOWS_SAMPLING: undersample
          CATMEOWS_VARIANTS: audio_global,audio_duration
          BRAIVOUR_AUDIO_FORM_BIN: '2'
          CATMEOWS_PRIOR_ALPHA: '0'
          CATMEOWS_PERSPECTIVES: ${{matrix.n}}
        run: node --max-old-space-size=6000 research/catmeows_native/run.mjs
      - name: Save owner-separated raw scores and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acoustic-perspectives-${{matrix.n}}
          path: |
            runtime/catmeows/results-*.json
            runtime/catmeows/heldout_predictions-*.jsonl
          if-no-files-found: warn
