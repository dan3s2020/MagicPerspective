name: CatMeows original Brain prior-corrected perception
on:
  push:
    branches: [experiment/CATMEOWS-NATIVE-BRAIN-20261115]
    paths:
      - 'research/catmeows_native/**'
      - 'v17/transcend/torus-aether/align.mjs'
      - '.github/workflows/catmeows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-decode:
    strategy:
      fail-fast: false
      matrix:
        alpha: [0, 0.5, 1]
    name: original-brain-prior-correction-${{matrix.alpha}}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Checksum and extract genuine CatMeows auditory events
        run: python research/catmeows_native/prepare.py
      - name: Blind owner-fold training and explicit shuffled-label causal control
        env:
          CATMEOWS_FULL: '1'
          CATMEOWS_TOKEN_MODE: high
          CATMEOWS_SAMPLING: undersample
          CATMEOWS_VARIANTS: audio_absolute,audio_duration,audio_change
          BRAIVOUR_AUDIO_FORM_BIN: '2'
          CATMEOWS_PRIOR_ALPHA: ${{matrix.alpha}}
        run: node --max-old-space-size=6000 research/catmeows_native/run.mjs
      - name: Save complete outcome journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-brain-alpha-${{matrix.alpha}}-raw
          path: |
            runtime/catmeows/results-*.json
            runtime/catmeows/heldout_predictions-*.jsonl
          if-no-files-found: warn
