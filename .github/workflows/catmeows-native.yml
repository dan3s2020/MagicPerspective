name: CatMeows native Brain acoustic form experiment
on:
  push:
    branches: [experiment/CATMEOWS-NATIVE-BRAIN-20261115]
    paths:
      - 'research/catmeows_native/**'
      - 'v17/transcend/torus-aether/align.mjs'
      - '.github/workflows/catmeows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-forms:
    strategy:
      fail-fast: false
      matrix:
        bin: [0, 2, 3, 4, 6, 12]
    name: audio-form-bin-${{matrix.bin}}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric reader
        run: python -m pip install numpy
      - name: Verify dataset MD5 and create label-blind audio event stream
        run: python research/catmeows_native/prepare.py
      - name: Train original Brain in a genuinely different sensory FORM geometry
        env:
          CATMEOWS_FULL: '1'
          CATMEOWS_TOKEN_MODE: high
          CATMEOWS_SAMPLING: undersample
          CATMEOWS_VARIANTS: audio_absolute
          BRAIVOUR_AUDIO_FORM_BIN: ${{matrix.bin}}
        run: node --max-old-space-size=6000 research/catmeows_native/run.mjs
      - name: Upload original-organism predictions and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-form-bin-${{matrix.bin}}-genuine-results
          path: |
            runtime/catmeows/results-*.json
            runtime/catmeows/heldout_predictions-*.jsonl
          if-no-files-found: warn
