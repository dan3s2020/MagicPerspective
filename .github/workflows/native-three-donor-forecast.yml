name: Three real numerical-weather donors through one original Brain
on:
  push:
    paths:
      - 'experiments/atmospheric-native-20261113/native-three-donor-forecast.mjs'
      - '.github/workflows/native-three-donor-forecast.yml'
  workflow_dispatch:
jobs:
  original-one-brain-three-donors:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin exactly unchanged native V42 source
        run: |
          git clone --depth 1 --branch perf/V42-FAST-EXACT-CPU-RESUME-V41FAST-20261107 https://github.com/dan3s2020/MagicPerspective.git /tmp/original-v42
          test "$(git -C /tmp/original-v42 rev-parse HEAD)" = "ac205b5bc561274b957584a7dee058a1110ab6f8"
      - name: Test native original Brain forecasting from three actual forecast donors
        env:
          V42_ORIGINAL_TEST_ROOT: /tmp/original-v42
        run: |
          node --check experiments/atmospheric-native-20261113/native-three-donor-forecast.mjs
          node --max-old-space-size=6000 experiments/atmospheric-native-20261113/native-three-donor-forecast.mjs
      - name: Save all predictions and official archived forecast provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-one-Brain-three-forecast-donors
          path: experiments/atmospheric-native-20261113/results/native-three-donor-forecast.json
          if-no-files-found: warn
