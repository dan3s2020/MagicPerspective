name: Original V17 multi-path/loop research integration
on:
  push:
    branches:
      - experiment/V17-MULTIPATH-SUCCESSOR-ISOLATED-20261106
      - experiment/V17-LIVE-MULTIPATH-OBSERVATORY-20261106
      - experiment/V17-TEXT-SOLUTION-SHAPE-REPLAY-20261106
  workflow_dispatch:
jobs:
  source-parity-and-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 2D and real-graph source tests
        run: |
          node --test isolated/native-language-paths/native.test.mjs
          node --test isolated/native-language-paths/multipath.test.mjs
          node --test isolated/native-language-paths/repetition.test.mjs
          node --test isolated/native-language-paths/live-research.test.mjs
          node --test isolated/native-language-paths/import-previous.test.mjs
          node --test isolated/native-language-paths/solution-shape-trace.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CI-only Parquet transport fixture (NOT benchmark)
        run: |
          python -m pip install --quiet pyarrow
          python tests/create_ci_parquet_fixture.py
      - name: Boot original V17 HTTP worker and require actual research events + original UI tab
        run: node --test tests/live-research-http.test.mjs
      - name: Parse original engine and all isolated components
        run: |
          node --check v17/transcend/torus-aether/worlds/exercise.mjs
          node --check v17/transcend/torus-aether/align.mjs
          node --check isolated/native-language-paths/train.mjs
          node --check isolated/native-language-paths/multipath.mjs
          node --check isolated/native-language-paths/atlas.mjs
          node --check isolated/native-language-paths/repetition.mjs
          node --check isolated/native-language-paths/live-research.mjs
          node --check isolated/native-language-paths/import-previous.mjs
          node --check isolated/native-language-paths/solution-shape-trace.mjs
          node --check v17/transcend/torus-aether/devour/worker.mjs
          node --check v17/transcend/torus-aether/devour/devour.mjs
          node --check v17/transcend/torus-aether/ui/app.js
          node --check v17/transcend/torus-aether/ui/research-panel.mjs
          node --check v17/transcend/torus-aether/ui/research-charts.mjs
          node --check v17/transcend/torus-aether/ui/research-replay.mjs
          node --check v17/transcend/torus-aether/ui/research-replay-draw.mjs
          node --check v17/transcend/torus-aether/ui/research-character-replay.mjs

  powershell5-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse original PowerShell 5.1 launcher
        shell: powershell
        run: |
          foreach ($file in @('START_NATIVE_LANGUAGE_PATHS.ps1','START_LIVE_MULTIPATH_V17.ps1','v17/START_V17.ps1')) {
            $errors = @()
            $scriptText = Get-Content -LiteralPath $file -Raw
            [System.Management.Automation.PSParser]::Tokenize($scriptText, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $file"
              $errors | Format-List | Out-String | Write-Host
              throw 'PowerShell launcher syntax errors'
            }
          }
      - name: Run V17 2D, graph and generator unit tests on Windows Node.js
        shell: powershell
        run: |
          node --test isolated/native-language-paths/native.test.mjs isolated/native-language-paths/multipath.test.mjs isolated/native-language-paths/repetition.test.mjs isolated/native-language-paths/live-research.test.mjs isolated/native-language-paths/import-previous.test.mjs isolated/native-language-paths/solution-shape-trace.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real-source regression tests failed on Windows' }
