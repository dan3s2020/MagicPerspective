name: V43 native MagicPerspective V42-to-V43 regression
on:
  push:
    branches:
      - feature/V43-NATIVE-V42-ONE-UNIVERSE-20261108
    paths:
      - "v17/START_V43.ps1"
      - "v17/v43/BOOTSTRAP_D.ps1"
      - "v17/START_V41_SPEED_PROFILE.ps1"
      - "v17/START_HYPERMAZE_REAL_CUDA.ps1"
      - "v17/v43/**"
      - "v17/apps/hypermaze-studio-v26/**"
      - "v17/transcend/torus-aether/devour/**"
      - "v17/tests/v43-native-one-universe.test.mjs"
      - "v17/tests/v43-native-http-ui.test.mjs"
      - ".github/workflows/v43-native-magicperspective.yml"
  pull_request:
  workflow_dispatch:
jobs:
  exact-original-native-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JS and Python source syntax checks
        run: |
          node --check v17/transcend/torus-aether/devour/devour.mjs
          node --check v17/transcend/torus-aether/devour/worker.mjs
          node --check v17/transcend/torus-aether/devour/brain-character-world.mjs
          node --check v17/transcend/torus-aether/devour/v43-fused-one-universe.mjs
          node --check v17/apps/hypermaze-studio-v26/native-bridge.mjs
          node --check v17/apps/hypermaze-studio-v26/public/v43-ui.js
          node --check v17/apps/hypermaze-studio-v26/v43-journal.mjs
          python -m py_compile v17/v43/gguf_checkpoint.py v17/v43/export_qwen.py
      - name: Actual original V42 Brain with synthetic donor fixture (not Qwen inference)
        run: node --test v17/tests/v43-native-one-universe.test.mjs
      - name: Same native V42 UI port + original Start Training end-to-end HTTP test
        run: MAGICPERSPECTIVE_V43_UI=1 node --test v17/tests/v43-native-http-ui.test.mjs
      - name: Existing original V42 UI and Brain source regression tests
        run: |
          node --test v17/tests/torus-observatory-ui.test.mjs
          node --test v17/tests/constructed-paths-speed-equivalence.test.mjs
  exact-powershell-launcher:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse V43 original chain and confirm V42 entry point has no mutations
        shell: pwsh
        run: |
          foreach($file in @(
            'v17/START_V43.ps1',
            'v17/v43/BOOTSTRAP_D.ps1',
            'v17/START_V41_SPEED_PROFILE.ps1',
            'v17/START_HYPERMAZE_REAL_CUDA.ps1'
          )) {
            $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file),[ref]$null,[ref]$parseErrors)|Out-Null
            if($parseErrors.Count){$parseErrors|Out-String|Write-Error;exit 1}
          }
          Write-Host 'V43_ORIGINAL_V42_LAUNCH_CHAIN_PARSE_PASS'
      - name: Parse downloaded bootstrap with actual Windows PowerShell 5.1 codepage
        shell: pwsh
        run: |
          $file = (Resolve-Path 'v17/v43/BOOTSTRAP_D.ps1').Path
          $raw = [System.IO.File]::ReadAllBytes($file)
          if($raw | Where-Object {$_ -gt 127}) {
            throw 'Bootstrap contains non-ASCII bytes: Windows PowerShell 5.1 decodes raw UTF-8 without BOM incorrectly'
          }
          $test = @'
          $file=$args[0]
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){
            foreach($e in $errors){[Console]::Error.WriteLine($e.ToString())}
            exit 1
          }
          '@
          $test | & powershell.exe -NoProfile -NonInteractive -Command - $file
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell 5.1 parser rejected V43 installer'}
          Write-Host 'V43_REAL_WINDOWS_POWERSHELL_5_1_PARSE_PASS'
      - name: Verify fresh D installer opens GUI file/folder pickers and never scans drives
        shell: pwsh
        run: |
          $bootstrap=Get-Content v17/v43/BOOTSTRAP_D.ps1 -Raw
          if($bootstrap -notmatch 'System\.Windows\.Forms\.OpenFileDialog' -or
             $bootstrap -notmatch 'System\.Windows\.Forms\.FolderBrowserDialog'){
            throw 'V43 lacks Qwen file picker or dataset folder picker'
          }
          if($bootstrap -notmatch 'D:\\LocalAi\\models'){
            throw 'Qwen picker does not begin at user-specified directory'
          }
          if($bootstrap -match 'Inventory-D|EnumerateDirectories\('){
            throw 'V43 must never scan drives looking for old installations'
          }
          if($bootstrap -notmatch 'selected-paths\.json'){
            throw 'V43 must remember explicitly selected paths'
          }
          Write-Host 'V43_D_GUI_PICKERS_SOURCE_POLICY_PASS'

