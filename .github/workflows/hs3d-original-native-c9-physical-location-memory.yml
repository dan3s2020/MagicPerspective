name: Original V42 Brain C9 real physical genome coordinate vs broken tag
on:
  push:
    branches:
      - research/HS3D-NATIVE-POSITION-C9-20261121
    paths:
      - .github/workflows/hs3d-original-native-c9-physical-location-memory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-C9-native-physical-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode:
          - native-C9-real-position
          - native-C9-missing-position
          - native-C9-broken-position
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: OluwadareLab/EnsembleSplice
          ref: e04aa5aeb4035adac9ce6c65c2143c2ef7163332
          path: comparison-checkouts/hs3d
          sparse-checkout: |
            ENSdatasets/hs3d_bal/Train
      - name: Check original native C9 actual positional input learning script
        run: node --check research/genome-native-brain-20261119/hs3d/native-position-c9/run-original-C9-physical-position.mjs
      - name: Original Brain lives two genuine destination 9-symbol worlds per real human genome
        shell: bash
        env:
          HS3D_C9_RAW_FILE: /tmp/original-V42-Brain-C9-real-position.json
        run: |
          set -euo pipefail
          node research/genome-native-brain-20261119/hs3d/native-position-c9/run-original-C9-physical-position.mjs comparison-checkouts/hs3d/ENSdatasets/hs3d_bal '${{ matrix.mode }}' | tee /tmp/original-V42-Brain-C9-real-position.log
      - name: Save all original Brain paired destination native predictions and negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-native-C9-real-genome-${{ matrix.mode }}
          path: |
            /tmp/original-V42-Brain-C9-real-position.json
            /tmp/original-V42-Brain-C9-real-position.log
          if-no-files-found: warn
