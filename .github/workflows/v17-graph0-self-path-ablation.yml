name: V17 graph0 frozen self-path ablation
on:
  push:
    branches:
      - experiment/V17-GRAPH0-SELF-PATH-ABLATION-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks for standalone ablation only
        run: |
          node --check v17/experiments/graph0-ablation-core.mjs
          node --check v17/experiments/graph0-self-path-ablation.mjs
          node --check v17/experiments/graph0-ablation-core.test.mjs
          node --check v17/experiments/graph0-ablation-end-to-end.test.mjs
          node --check v17/experiments/create-graph0-fixture.mjs
          node --check v17/experiments/graph0-phase2.mjs
          node --check v17/experiments/graph0-phase2.test.mjs
          node --check v17/experiments/graph0-geometry-wall-audit.mjs
          node --check v17/experiments/graph0-geometry-wall-audit.test.mjs
          node --check v17/experiments/graph0-heldout-axis-core.mjs
          node --check v17/experiments/graph0-heldout-axis-core.test.mjs
          node --check v17/experiments/graph0-heldout-axis.mjs
      - name: Native AligningGraph no-training ablation tests
        run: node --test v17/experiments/graph0-ablation-core.test.mjs
      - name: Native Brain.save Brain.load comparison across original and filtered policies
        run: node --test v17/experiments/graph0-ablation-end-to-end.test.mjs
      - name: Phase2 fixed-length no-fself and half-strength native fixture tests
        run: node --test v17/experiments/graph0-phase2.test.mjs
      - name: Native 5D policy wall causal audit from any working directory
        run: node --test v17/experiments/graph0-geometry-wall-audit.test.mjs
      - name: Native FIELD and ALIGNED predictive causal gating, no future leakage
        run: node --test v17/experiments/graph0-heldout-axis-core.test.mjs
  windows-launcher-smoke:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Save synthetic native V17 graph0 fixture
        shell: pwsh
        run: |
          node v17/experiments/create-graph0-fixture.mjs "$env:RUNNER_TEMP\graph0-source"
          if ($LASTEXITCODE -ne 0) { throw "Fixture creation failed" }
      - name: Execute exact Windows PowerShell 5.1 checkpoint-copy launcher
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File "v17\experiments\RUN_GRAPH0_ABLATION.ps1" -SourceBrains "$env:RUNNER_TEMP\graph0-source" -ResultsRoot "$env:RUNNER_TEMP\graph0-results" -Max 80
          if ($LASTEXITCODE -ne 0) { throw "Windows isolated ablation failed" }
          $matches = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\graph0-results" -Recurse -File -Filter "comparison-T06.csv")
          if ($matches.Count -ne 1) { throw "Missing unique Windows comparison CSV" }
          $rows = @(Import-Csv -LiteralPath $matches[0].FullName)
          if ($rows.Count -ne 12) { throw "Expected 12 T=0.6 comparison rows; found $($rows.Count)" }
          Write-Host "WINDOWS_NATIVE_ABLATION_PASS: $($rows.Count) comparison rows"
      - name: Exact Windows PowerShell Phase 2 on the same synthetic checkpoint
        shell: pwsh
        run: |
          $copies = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\graph0-results" -Recurse -File -Filter "graph0-checkpoint-copy.v8")
          if ($copies.Count -ne 1) { throw "Expected unique frozen phase1 checkpoint" }
          $phase2Script = Join-Path $env:GITHUB_WORKSPACE "v17\experiments\RUN_GRAPH0_PHASE2.ps1"
          Push-Location $env:USERPROFILE
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $phase2Script -CheckpointCopy $copies[0].FullName -ResultsRoot "$env:RUNNER_TEMP\graph0-phase2" -Max 80
            if ($LASTEXITCODE -ne 0) { throw "Phase2 Windows failed outside repository CWD" }
          } finally { Pop-Location }
          $csv = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\graph0-phase2" -Recurse -File -Filter "phase2-fixed240-comparison.csv")
          if ($csv.Count -ne 1) { throw "Missing phase2 comparison CSV" }
          $rows = @(Import-Csv -LiteralPath $csv[0].FullName)
          if ($rows.Count -ne 24) { throw "Phase2 expected 24 comparisons; got $($rows.Count)" }
          Write-Host "WINDOWS_PHASE2_PASS: $($rows.Count) fixed-length rows from six isolated arms"
          $wall = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\graph0-phase2" -Recurse -File -Filter "graph0-geometry-policy-wall-audit.json")
          if ($wall.Count -ne 1) { throw "Expected 5D wall report alongside phase2 CSV" }
          $report = Get-Content -LiteralPath $wall[0].FullName -Raw | ConvertFrom-Json
          if (-not $report.invariantTextAllPrompts -or -not $report.geometryChangeVisible) { throw "5D wall audit invariance failed" }
          Write-Host "WINDOWS_GEOMETRY_POLICY_WALL_PASS: native text unchanged after changing actual 5D geometry"
      - name: Install CI-only Parquet fixture generator
        shell: pwsh
        run: python -m pip install --quiet pyarrow
      - name: Create native real-format Parquet with held-out rows
        shell: pwsh
        run: |
          python "v17/experiments/create-heldout-axis-fixture.py" "$env:RUNNER_TEMP\graph0-parquet"
          if ($LASTEXITCODE -ne 0) { throw "Parquet fixture generation failed" }
      - name: Execute Windows 5.1 native frozen held-out 5D policy scoring
        shell: pwsh
        run: |
          $copies = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\graph0-results" -Recurse -File -Filter "graph0-checkpoint-copy.v8")
          if ($copies.Count -ne 1) { throw "Expected frozen checkpoint copy" }
          $heldoutScript = Join-Path $env:GITHUB_WORKSPACE "v17\experiments\RUN_GRAPH0_HELDOUT_AXIS.ps1"
          Push-Location $env:USERPROFILE
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $heldoutScript -CheckpointCopy $copies[0].FullName -Data "$env:RUNNER_TEMP\graph0-parquet" -ResultsRoot "$env:RUNNER_TEMP\graph0-heldout-results" -Rows 4 -MaxChars 512
            if ($LASTEXITCODE -ne 0) { throw "Frozen held-out script failed outside repository CWD" }
          } finally { Pop-Location }
          $reports = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\graph0-heldout-results" -Recurse -File -Filter "graph0-heldout-axis-score.json")
          if ($reports.Count -ne 1) { throw "Expected 1 held-out experiment report" }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.selectedRows -ne 4 -or $report.heldoutRowsAvailable -ne 16) { throw "Incorrect native heldout selection" }
          if ($report.aggregates.normal."0".answerTotal -lt 16) { throw "Empty heldout answer assessment" }
          Write-Host "WINDOWS_REAL_PARQUET_HELDOUT_PROBE_PASS: $($report.selectedRows) rows"
