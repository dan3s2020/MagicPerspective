name: Save reload and blind test original weather organism
on:
  push:
    paths:
      - 'experiments/atmospheric-native-20261113/native-issued24h-persistent-organ.mjs'
      - '.github/workflows/native-weather-persistent-organ.yml'
  workflow_dispatch:
jobs:
  native-v42-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch SHA-pinned original Brain
        run: |
          git clone --depth 1 --branch perf/V42-FAST-EXACT-CPU-RESUME-V41FAST-20261107 https://github.com/dan3s2020/MagicPerspective.git /tmp/original-v42
          test "$(git -C /tmp/original-v42 rev-parse HEAD)" = "ac205b5bc561274b957584a7dee058a1110ab6f8"
      - name: Verify checkpoint persistence then predict from REAL restored organism
        env:
          V42_ORIGINAL_TEST_ROOT: /tmp/original-v42
        run: |
          node --check experiments/atmospheric-native-20261113/native-issued24h-persistent-organ.mjs
          node --max-old-space-size=6000 experiments/atmospheric-native-20261113/native-issued24h-persistent-organ.mjs
      - name: Preserve full original Brain checkpoint and raw independent predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-forecaster-original-brain-checkpoint-raw
          path: |
            experiments/atmospheric-native-20261113/results/original-weather-future-brain.v8
            experiments/atmospheric-native-20261113/results/native-issued24h-restored-organ.json
          if-no-files-found: warn
