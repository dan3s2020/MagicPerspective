name: V42 Original Text Value Field - Goal Union vs Intersection
on:
  push:
    branches:
      - research/V42-TORUS-LOOP-INTERSECTION-HYPOTHESES-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-text-goal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original Brain.liveLanguage recurrent goal tests and checkpoint
        run: |
          node --check v17/tests/text-attraction-vs-intersection-20261107.test.mjs
          node --test v17/tests/text-attraction-vs-intersection-20261107.test.mjs
