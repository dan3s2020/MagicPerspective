name: V17 real dataset exercise percent, both original and Magic UIs
on:
  push:
    branches:
      - feature/V17-REAL-DATASET-PROGRESS-FULL-INSTALL-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dataset-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax of actual V17 server and original+Magic UIs
        run: |
          node --check v17/transcend/torus-aether/devour/dataset-progress.mjs
          node --check v17/transcend/torus-aether/devour/devour.mjs
          node --check v17/transcend/torus-aether/ui/magic.js
          node --check v17/transcend/torus-aether/ui/app.js
          node --check v17/tests/native-dataset-progress.test.mjs
          node --check v17/tests/magic-live-native-ui.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build real Parquet fixtures with PyArrow
        run: python -m pip install pyarrow
      - name: Actual native V17 Parquet reader and two UIs (NOT simulated corpus totals)
        run: node --test v17/tests/native-parquet-dataset-progress.test.mjs
      - name: Exact train/heldout row totals, shards, resume & non-ASCII count
        run: node --test v17/tests/native-dataset-progress.test.mjs
      - name: ORIGINAL V17 worker streams REAL training, both UIs see real progress
        run: node --test v17/tests/magic-live-native-ui.test.mjs
      - name: Previous native V17 mathematical observer remains unchanged
        run: node --test v17/tests/live-predictive-state-gate.test.mjs
  windows-original-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyArrow for an ACTUAL 120-shard Parquet metadata fixture
        run: python -m pip install pyarrow
      - name: Build real 1.2M-row metadata fixture, including a legacy root duplicate
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "open-thoughts-verification-fixture"
          python v17/tests/generate-verifier-parquet-fixture.py $root
          if ($LASTEXITCODE -ne 0) { throw "Could not create 120 real Parquet shards" }
          echo "MP_FULL_DATASET_ROOT=$root" >> $env:GITHUB_ENV
      - name: Run EXACT Windows PowerShell installer on already downloaded data (NO node -e, NO GPU)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "v17/INSTALL_FULL_AND_TRAIN.ps1" -Data $env:MP_FULL_DATASET_ROOT -Out (Join-Path $env:RUNNER_TEMP "not-run-training") -SkipDownload -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Real Windows verification failed" }
          if (Test-Path (Join-Path $env:RUNNER_TEMP "not-run-training")) { throw "VerifyOnly must not start training or create checkpoints" }
      - name: Check original launchers and complete dataset installer syntax without executing any GPU mock
        shell: powershell
        run: |
          foreach ($path in @("v17/START_MAGIC_REAL.ps1","v17/START_V17.ps1","v17/INSTALL_FULL_AND_TRAIN.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell syntax: "+$path+" "+($errors | Out-String)) }
            Write-Host "WINDOWS_PS_OK $path"
          }
