name: V20 Native Observed Text Hypermaze - Integration and Regression
on:
  push:
    branches:
      - experiment/V20-OBSERVED-TEXT-HYPERMAZE-LIVE-20261107
  workflow_dispatch:
jobs:
  real-native-hypermaze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual V17 worker and mathematical text hypermaze tests
        run: node --test v17/tests/torus-text-hypermaze.test.mjs
      - name: Original V19 cognitive and world-source regressions
        run: |
          node --test v17/tests/torus-cognitive-learned-map.test.mjs
          node --test v17/tests/torus-world-source-regression.test.mjs
          node --test v17/tests/torus-v19-cognitive-runtime.test.mjs
