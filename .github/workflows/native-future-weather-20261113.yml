name: Native organism strict future weather blind benchmark
on:
  push:
    paths:
      - 'experiments/atmospheric-native-20261113/native-future-blind.mjs'
      - '.github/workflows/native-future-weather-20261113.yml'
  workflow_dispatch:
jobs:
  original-brain-future-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin exact original V42 Brain
        shell: bash
        run: |
          git clone --depth 1 --branch perf/V42-FAST-EXACT-CPU-RESUME-V41FAST-20261107 https://github.com/dan3s2020/MagicPerspective.git /tmp/original-v42
          test "$(git -C /tmp/original-v42 rev-parse HEAD)" = "ac205b5bc561274b957584a7dee058a1110ab6f8"
      - name: Syntax check before test
        run: node --check experiments/atmospheric-native-20261113/native-future-blind.mjs
      - name: One original Brain lives real weather and predicts actual unseen future
        env:
          V42_ORIGINAL_TEST_ROOT: /tmp/original-v42
        run: node --max-old-space-size=6000 experiments/atmospheric-native-20261113/native-future-blind.mjs
      - name: Preserve full raw validation and test forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-brain-future-blind-full-evidence
          path: experiments/atmospheric-native-20261113/results/native-future-prediction.json
          if-no-files-found: warn
