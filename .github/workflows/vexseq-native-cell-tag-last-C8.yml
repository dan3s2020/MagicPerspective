name: Vexseq real K H biological condition token final C8 causal mechanism
on:
  push:
    branches:
      - research/VEXSEQ-NATIVE-CELL-CONDITIONED-20261122
    paths:
      - .github/workflows/vexseq-native-cell-tag-last-C8.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-physical-cell-token-at-final-lag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [condition-true-last, condition-blind-last]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned original actual K562/HepG2 reporter-assay REF ALT constructs
        uses: actions/checkout@v4
        with:
          repository: scottiadamson/Vex-seq
          ref: 36d9c4a6e5e74def46b3cada69d3166f08c54bd5
          path: comparison-checkouts/vexseq
          sparse-checkout: |
            processed_files/delta_PSI_values.tsv
            processed_files/control_variant_pairs.csv
            processed_files/Vex-seq_positions.tsv
            preprocess_data/68_97_final_sequences_fixed.tsv
      - name: Verify genuine source and preregistered native C8 cell-lag test
        shell: bash
        run: |
          set -euo pipefail
          node --check research/genome-native-brain-20261119/variant-effects/vexseq/conditioned/run-cell-tag-last.mjs
          test -f research/genome-native-brain-20261119/variant-effects/vexseq/conditioned/C8_TEMPORAL_CELL_TAG_PRETEST.md
      - name: Same original Brain learns real cell-dependent mutation effects with causal late-cell token
        env:
          VEXSEQ_CELL_PHASE: dev
          VEXSEQ_CELL_RAW_RESULT_FILE: /tmp/Vexseq-real-C8-cell-last.json
        shell: bash
        run: |
          set -eo pipefail
          node research/genome-native-brain-20261119/variant-effects/vexseq/conditioned/run-cell-tag-last.mjs comparison-checkouts/vexseq '${{ matrix.mode }}' | tee /tmp/Vexseq-real-C8-cell-last.log
      - name: Preserve measured and matched biological condition observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vexseq-native-C8-cell-last-${{ matrix.mode }}
          path: |
            /tmp/Vexseq-real-C8-cell-last.json
            /tmp/Vexseq-real-C8-cell-last.log
          if-no-files-found: warn
