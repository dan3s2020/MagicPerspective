name: 'TERMUX Original Braivour - real audio input-response-training-save-restart E2E'
on:
  push:
    branches: [experiment/CATMEOWS-TERMUX-LIVE-CONVERSATION-20261116]
    paths:
      - 'research/catmeows_native/termux_audio/**'
      - '.github/workflows/termux-braivour-actual-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-real-original-brain:
    name: original V17 Brain full audio / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24','26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install physical audio source dependencies
        run: |
          python -m pip install numpy
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          if ! command -v unzip >/dev/null 2>&1; then sudo apt-get install -y unzip; fi
          ffmpeg -version | head -1
          node -v
      - name: Download exact prior genuine 44MB original V17 Braivour nine-auditory-dimensional Brain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/termux_cat_audio/checkpoints /tmp/original9dbraivour
          gh run download 43778465862 --repo dan3s2020/MagicPerspective --name original-braivour-full9d-audio-consequence-chronological --dir /tmp/original9dbraivour
          cp /tmp/original9dbraivour/Original_Braivour_9D_SoundTransform_Body_chronological.v8 runtime/termux_cat_audio/checkpoints/active.v8
          test "$(wc -c < runtime/termux_cat_audio/checkpoints/active.v8)" -gt 40000000
      - name: Verify actual Termux install script from the previously learned Brain ZIP (not a new Brain)
        run: |
          python - <<'PY'
          import zipfile,shutil
          from pathlib import Path
          root=Path("runtime/termux_cat_audio/checkpoints")
          src=root/"active.v8"
          copied=Path("/tmp/Original_Braivour_9D_SoundTransform_Body_chronological.v8")
          shutil.move(src,copied)
          with zipfile.ZipFile("/tmp/Braivour_Native_9D_Sound_Transform_WAVs_And_Brain.zip","w",compression=zipfile.ZIP_STORED) as z:
            z.write(copied,arcname=copied.name)
          PY
          bash research/catmeows_native/termux_audio/install.sh /tmp/Braivour_Native_9D_Sound_Transform_WAVs_And_Brain.zip
          test "$(wc -c < runtime/termux_cat_audio/checkpoints/active.v8)" -gt 40000000
          bash research/catmeows_native/termux_audio/install.sh /tmp/Braivour_Native_9D_Sound_Transform_WAVs_And_Brain.zip
      - name: Verify official CatMeows 440 real WAVs and select two different actual cats
        run: |
          python research/catmeows_native/prepare_generative.py
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path("runtime/catmeows/dataset.zip")
          dest=Path("runtime/termux_cat_audio")
          dest.mkdir(parents=True,exist_ok=True)
          used=set()
          with zipfile.ZipFile(p) as z:
            for name in sorted(z.namelist()):
              if not name.lower().endswith(".wav"):continue
              cat=Path(name).stem.split("_")[1]
              if cat in used:continue
              raw=z.read(name)
              if len(raw)<9000:continue
              used.add(cat)
              (dest/("real_cat_fixture_"+str(len(used))+".wav")).write_bytes(raw)
              if len(used)==2:break
          assert len(used)==2
          print("ACTUAL_DIFFERENT_REAL_CAT_WAVS",used)
          PY
      - name: Start exact original Brain local phone server, run real two-mic-input conversations and train
        run: |
          node --max-old-space-size=1536 research/catmeows_native/termux_audio/server.mjs > /tmp/original-braivour-phone.log 2>&1 &
          BRAIVOUR_PID=$!
          echo "$BRAIVOUR_PID" > /tmp/braivour_pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/status > /tmp/status.json; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/original-braivour-phone.log; exit 3; fi
          ffmpeg -nostdin -y -hide_banner -loglevel error -i runtime/termux_cat_audio/real_cat_fixture_1.wav -ac 1 -c:a libopus -b:a 32k -f webm runtime/termux_cat_audio/browser_microphone_opus.webm
          python research/catmeows_native/termux_audio/smoke_test.py full runtime/termux_cat_audio/real_cat_fixture_1.wav runtime/termux_cat_audio/real_cat_fixture_2.wav runtime/termux_cat_audio/browser_microphone_opus.webm || {
              cat /tmp/original-braivour-phone.log
              exit 5
            }
          kill "$BRAIVOUR_PID"
          wait "$BRAIVOUR_PID" || true
      - name: Reboot the LOCAL service from the UPDATED saved whole original Brain, verify conversation remains possible
        run: |
          node --max-old-space-size=1536 research/catmeows_native/termux_audio/server.mjs > /tmp/original-braivour-restart.log 2>&1 &
          BRAIVOUR_PID=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/status > /dev/null; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/original-braivour-restart.log; exit 4; fi
          python research/catmeows_native/termux_audio/smoke_test.py resume || {
            cat /tmp/original-braivour-restart.log
            exit 6
          }
          kill "$BRAIVOUR_PID"
          wait "$BRAIVOUR_PID" || true
      - name: Preserve real rendered native generated sounds and audit (never fabricate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-braivour-termux-node${{ matrix.node }}-e2e
          path: |
            runtime/termux_cat_audio/actual_termux_smoke_result.json
            runtime/termux_cat_audio/output/*.wav
            runtime/termux_cat_audio/state.json
          if-no-files-found: warn
