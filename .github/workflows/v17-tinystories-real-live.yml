name: TinyStories-only Aether (real streaming text and independent live UI)
on:
  push:
    branches:
      - feature/V17-CUDA-STREAMING-MEGABYTE-TEXT-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-text-model-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual NumPy backend used by Python GPU protocol
        run: python3 -m pip install "numpy>=2,<3"
      - name: Source syntax for TinyStories and original V17 GPU protocol
        run: |
          python3 -m py_compile v17/transcend/torus-aether/gpu/fast_text.py
          python3 -m py_compile v17/transcend/torus-aether/gpu/worlds_gpu.py
          node --check v17/research/tinystories/story-stream.mjs
          node --check v17/research/tinystories/server.mjs
          node --check v17/research/tinystories/ui/app.js
          node --check v17/tests/tinystories-aether-live.test.mjs
      - name: End-to-end independent TinyStories stream through actual Python engine, live UI, frozen heldout and checkpoint resume
        run: node --test v17/tests/tinystories-aether-live.test.mjs
      - name: Keep original V17 CUDA-world auto fix regression
        run: node --test v17/tests/cuda-auto-gpu-worlds.test.mjs
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse independent TinyStories Windows launcher and original Magic V17 launcher
        shell: powershell
        run: |
          foreach ($p in @("v17/START_TINYSTORIES.ps1","v17/START_MAGIC_REAL.ps1","v17/START_V17.ps1")) {
            $tok=$null; $err=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tok,[ref]$err) | Out-Null
            if ($err.Count -gt 0) { throw ("PowerShell parse errors in " + $p + ": " + ($err | Out-String)) }
            Write-Host "WINDOWS_TINYSTORIES_POWERSHELL_PARSE_OK $p"
          }
      - name: Validate tiny-launcher refuses a missing TinyStories dataset without touching original output
        shell: powershell
        run: |
          $output=Join-Path $env:TEMP "tiny-safety-original"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $original=Join-Path $output "important.txt"
          Set-Content -LiteralPath $original -Value "PRESERVE" -NoNewline
          $hash=(Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash
          $data=Join-Path $env:TEMP "tinystories-nonexistent-dataset-20261107"
          $ErrorActionPreference="Continue"
          $log = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "v17/START_TINYSTORIES.ps1" -Data $data -Out $output -Gpu cuda:0 2>&1 | Out-String
          $exitCode=$LASTEXITCODE
          if ($exitCode -eq 0) { throw "Unsafe TinyStories launcher started with missing data." }
          if ((Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash -ne $hash) {
            throw "User data was modified"
          }
          if ($log -notmatch "Missing TinyStories train TXT") { throw ("Unexpected rejection: "+$log) }
          Write-Host "WINDOWS_TINYSTORIES_SAFETY_PASS"
          $global:LASTEXITCODE=0
