name: V44 Independent Engine / UI / Windows
on:
  push:
    branches: ["feature/V44-INDEPENDENT-STREAM-CUDA-20261109"]
    paths: ["v44/**", ".github/workflows/v44-integrity.yml"]
  workflow_dispatch:
jobs:
  test-node:
    name: V44 New UI / native controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test v44/tests/test_studio.mjs
  test-python:
    name: V44 Real vectorized learner / synthetic CPU verification ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s v44/tests -p "test_engine.py" -v
      - run: python -m py_compile v44/engine.py
  test-powershell:
    name: Windows PowerShell 5.1 / startup validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          $file=(Resolve-Path "v44/START_V44.ps1").Path
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ($errors | Out-String)}
          if(Select-String -LiteralPath $file -Pattern "Get-FileHash" -Quiet) { throw "Forbidden Get-FileHash dependency" }
          $required=@("v44/engine.py","v44/server.mjs","v44/data-worker.mjs","v44/studio.html","v44/studio.css","v44/studio.js")
          foreach($item in $required){if(!(Test-Path -LiteralPath $item)){throw "Missing V44 source $item"}}
