name: V21 Aether Veil — Native V17/V20 contextual learning and regressions
on:
  push:
    branches:
      - experiment/V21-AETHER-VEIL-PREDICTIVE-PERSPECTIVE-20261107
  workflow_dispatch:
jobs:
  aether-veil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python original text engine GPU allocation regression (no device needed)
        run: |
          python3 -m pip install --quiet numpy
          python3 -m unittest discover -s v17/tests -p test_v21_gpu_text_allocation.py -v
      - name: V21 GPU settings changes must not rebuild the loaded CUDA text index
        run: node --test v17/tests/veil-aether.gpu-hot-settings.test.mjs
      - name: V21 actual dataset consumption and percentage accounting (TXT, Parquet, workers)
        run: node --test v17/tests/veil-aether.dataset-progress.test.mjs
      - name: V21 observed contextual graph, pre-action shape, no-leak and preservation tests
        run: node --test v17/tests/veil-aether.test.mjs
      - name: V21 actual observed action axes, stochastic causal branching, path-order memory
        run: node --test v17/tests/veil-aether.observed-action-field.test.mjs
      - name: V21 do not score truncated 200-character question as a failed written answer
        run: node --test v17/tests/veil-aether.shape-boundary-regression.test.mjs
      - name: V21 actual multiworld worker, live UI and HTTP evidence
        run: node --test v17/tests/veil-aether.http.test.mjs
      - name: V21 preserve native V17 Q/A shape learning after legacy checkpoint resume
        run: node --test v17/tests/veil-aether.text-migration.test.mjs
      - name: Parse real Windows PowerShell launchers and assert all native worlds enabled
        shell: pwsh
        run: |
          foreach ($file in @('v17/START_V21_AETHER_VEIL.ps1', 'v17/ENSURE_V21_CUDA.ps1')) {
            $tokens = $null
            $errorsFound = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errorsFound)
            if ($errorsFound.Count -gt 0) {
              $errorsFound | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax invalid: $file"
            }
          }
          $launcher = Get-Content -Raw v17/START_V21_AETHER_VEIL.ps1
          if ($launcher -notmatch 'text,hypertext,maze,transform') {
            throw "Native V17 text world not selected with V20/V21"
          }
      - name: Block any non-ASCII byte in Windows PowerShell 5.1 entrypoints
        shell: pwsh
        run: |
          foreach ($file in @('v17/START_V21_AETHER_VEIL.ps1', 'v17/ENSURE_V21_CUDA.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            $bad = @($bytes | Where-Object { $_ -gt 127 })
            if ($bad.Count -gt 0) {
              throw "Windows PowerShell 5.1 parses UTF-8 without BOM as system ANSI; forbid non-ASCII bytes in $file : $($bad.Count)"
            }
          }
      - name: V21 requested CUDA must fail closed if Python does not have CUDA
        run: node --test v17/tests/veil-aether.cuda-failclosed.test.mjs
      - name: V21 client JavaScript syntax
        run: node --check v17/transcend/torus-aether/ui/veil-aether-live.js
      - name: Original V17 UI script syntax preserved
        run: node --check v17/transcend/torus-aether/ui/app.js
      - name: Original V20 real corpus process, HTTP and checkpoint regressions
        run: node --test v17/tests/torus-text-hypermaze.test.mjs
      - name: Original V19 cognitive model and world-source regressions
        run: |
          node --test v17/tests/torus-cognitive-learned-map.test.mjs
          node --test v17/tests/torus-world-source-regression.test.mjs
          node --test v17/tests/torus-v19-cognitive-runtime.test.mjs

  preserved-discovery-controls:
    name: Frozen original-branch discoveries (NOT proof of native integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-LEARNED-AXES-PERSPECTIVE-GATING-20261107
          path: evidence/learned-axes
      - name: Native original research — learned high-dimensional axis gating and noised paths
        run: node --test evidence/learned-axes/v17/tests/learned-axis-gating.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-LEARNED-LOCAL-AXES-CAUSAL-ROUTES-20261107
          path: evidence/local-axes
      - name: Native original research — local frames, affine word effects, negative heldout text control
        run: |
          node --test evidence/local-axes/v17/tests/local-axis-transport-shapes.test.mjs
          node --test evidence/local-axes/v17/tests/math-language-transformation-shapes.test.mjs
          node --test evidence/local-axes/v17/tests/coupled-symbolic-local-axes.test.mjs
          node --test evidence/local-axes/v17/tests/native-context-axis-geometry.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-PATH-HOLONOMY-MEMORY-DIMENSION-20261107
          path: evidence/holonomy
      - name: Native original research — path-dependent signed-area holonomy
        run: node --test evidence/holonomy/v17/tests/text-path-holonomy-memory.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-TEXT-MAZE-COUPLED-AXES-20261107
          path: evidence/coupled
      - name: Native original research — coupled numerical text transformations and replanning
        run: node --test evidence/coupled/v17/tests/text-hypermaze-coupled-axes.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-2048-HIERARCHICAL-MERGE-20261107
          path: evidence/stochastic-2048
      - name: Native original research — stochastic 2048 exact chance branches
        run: node --test evidence/stochastic-2048/v17/tests/2048-stochastic-world.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-XD-SCALE-INVARIANT-TRANSFORMS-20261107
          path: evidence/xd
      - name: Native original research — geometric xD invariance, saturation and negative baselines
        run: |
          node --test evidence/xd/v17/tests/xd-gauge-collapse.test.mjs
          node --test evidence/xd/v17/tests/xd-predictive-operator-rank.test.mjs
          node --test evidence/xd/v17/tests/xd-scale-normalization.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-ONE-SHARED-TRANSFORMATION-CORE-20261107
          path: evidence/shared
      - name: Native original research — shared world action policy and HTTP persistence
        run: |
          node --test evidence/shared/v17/tests/shared-world-core-v17.test.mjs
          node --test evidence/shared/v17/tests/shared-world-core-http.test.mjs

      - uses: actions/checkout@v4
        with:
          ref: experiment/V17-REAL-CORPUS-AXIS-GATING-20261107
          path: evidence/real-gating
      - name: Native original research — real-document gating and negative/positive frozen controls
        run: node --test evidence/real-gating/v17/tests/real-corpus-axis-gating.test.mjs

  windows-powershell-51:
    name: Real Windows PowerShell 5.1 syntax and ANSI regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse launchers in Windows PowerShell 5.1 itself
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $edition = $PSVersionTable.PSVersion
          Write-Host "PowerShell version $edition"
          if ($edition.Major -ne 5 -or $edition.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1, not PowerShell Core."
          }
          foreach ($file in @("v17/START_V21_AETHER_VEIL.ps1", "v17/ENSURE_V21_CUDA.ps1")) {
            $path = (Resolve-Path $file).Path
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "Non-ASCII bytes in ${file}: Windows PowerShell 5.1 may misread UTF-8 em dash as a smart quotation mark."
            }
            $tokens = $null
            $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$problems)
            if ($problems.Count -gt 0) {
              $problems | ForEach-Object { Write-Host $_.Message }
              throw "Windows PowerShell 5.1 parser regression in $file"
            }
          }
          Write-Host "PASS: V21 launcher and GPU preflight parsed in native Windows PowerShell 5.1"
