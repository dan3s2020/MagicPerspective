name: V42 hidden state and holonomy original native tests
on:
  push:
    branches: [experiment/V42-FIBONACCI-LANGUAGE-20261109]
  workflow_dispatch:
jobs:
  holonomy-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute pre-existing native holonomy, hidden-state and geometric tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            v17/tests/text-path-holonomy-memory.test.mjs \
            v17/tests/text-discover-missing-state.test.mjs \
            v17/tests/text-discover-hidden-causal-bit.test.mjs \
            v17/tests/xd-gauge-collapse.test.mjs \
            v17/tests/xd-predictive-operator-rank.test.mjs \
            2>&1 | tee native_hidden_structure_tests.log
      - name: Artifact native evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v42-hidden-holonomy-tests
          path: native_hidden_structure_tests.log
          retention-days: 7
